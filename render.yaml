services:
  frontend:
    type: web
    name: smart-frontend
    env: node
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm run preview --prefix frontend -- --host 0.0.0.0 --port $PORT
    staticPublishPath: frontend/dist
    repo: .
    branch: main
    envVars:
      - key: VITE_BACKEND_URL
        value: https://smart-backend.onrender.com
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: ${VITE_GOOGLE_MAPS_API_KEY}

  backend:
    type: web
    name: smart-backend
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/config
    repo: .
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: ${MONGO_URI}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: MAPS_API_KEY
        value: ${MAPS_API_KEY}
      - key: EMAIL_USER
        value: ${EMAIL_USER}
      - key: EMAIL_PASS
        value: ${EMAIL_PASS}
      - key: EMAIL_FROM
        value: ${EMAIL_FROM}
